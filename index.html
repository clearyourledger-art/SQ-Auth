<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>Clear Ledger · QuickBooks Sign-in</title>
<style>
  body{font-family:Inter,system-ui,sans-serif;background:#f0f4f8;color:#1e293b;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:16px;}
  .box{text-align:center;padding:36px;background:#fff;border-radius:16px;border:1px solid #e2e8f0;max-width:440px;box-shadow:0 4px 20px rgba(0,0,0,.08);}
  h2{font-size:19px;margin:0 0 10px;} p{color:#64748b;font-size:14px;line-height:1.6;margin:8px 0;} a{color:#2563eb;}
</style>
</head>
<body>
<div class="box">
  <h2>Finishing QuickBooks sign-in…</h2>
  <p id="msg">Sending you back to your Clear Ledger app on this computer.</p>
  <p id="fallback" style="display:none">If nothing happens, make sure the app is running, then <a id="link" href="#">click here</a>.</p>
</div>
<script>
  // Intuit requires an HTTPS redirect for Production keys. This page only
  // forwards Intuit's response (code, state, realmId) to the app running on
  // this computer. Nothing is stored or sent anywhere else.
  //   state "p3005-…"  → Proof (dev)            http://localhost:3005/qbo/callback
  //   anything else    → Square Connector       http://localhost:3001/callback
  (function () {
    var qs = window.location.search || '';
    if (!qs) {
      document.getElementById('msg').textContent = 'This page finishes QuickBooks sign-in for Clear Ledger apps. Start the connection from the app.';
      return;
    }
    var state = new URLSearchParams(qs).get('state') || '';
    var m = /^p(\d{4,5})-/.exec(state);
    var port = m ? parseInt(m[1], 10) : 3001;
    if (port < 1024 || port > 65535) port = 3001;
    var target = 'http://localhost:' + port + (m ? '/qbo/callback' : '/callback') + qs;
    document.getElementById('link').href = target;
    setTimeout(function () { document.getElementById('fallback').style.display = ''; }, 2500);
    window.location.replace(target);
  })();
</script>
</body>
</html>
